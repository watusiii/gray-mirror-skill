<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gray Mirror</title>
<style>
:root{--surface-0:#f4f3ef;--surface-1:#ebeae4;--surface-2:#fff;--text-primary:#111;--text-secondary:#555;--text-muted:#999;--text-danger:#c33;--border:#ddd;--border-stronger:#888;--radius:8px;--in:#5DCAA5;--out:#F0997B;--stock:#B5D4F4;--stock-ink:#0C447C;--stock-sub:#185FA5;--link:#888780;--font-mono:ui-monospace,Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--surface-0:#111;--surface-1:#1b1b1b;--surface-2:#222;--text-primary:#eee;--text-secondary:#aaa;--text-muted:#777;--text-danger:#f77;--border:#333;--border-stronger:#777;--in:#1D9E75;--out:#D85A30;--stock:#0C447C;--stock-ink:#E6F1FB;--stock-sub:#B5D4F4;--link:#B4B2A9}}
body{margin:0;padding:16px;background:var(--surface-0);color:var(--text-primary);font:15px/1.5 system-ui,sans-serif}
button{background:transparent;color:var(--text-primary);border:0.5px solid var(--border-stronger);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gm-row{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
@media(max-width:700px){.gm-row{grid-template-columns:minmax(0,1fr)}}
.gm-ta{width:100%;height:340px;font:12px/1.55 var(--font-mono);background:var(--surface-1);color:var(--text-primary);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px;resize:vertical;box-sizing:border-box;white-space:pre;overflow:auto}
.gm-err{font-size:13px;color:var(--text-danger);min-height:18px;margin:6px 0 0}
.gm-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.gm-ctl span{font-size:13px;color:var(--text-secondary)}
</style></head><body>
<h2 class="sr-only">Gray Mirror stock and flow map with simulation charts.</h2>
<div class="gm-row">
<div>
<textarea class="gm-ta" id="gmsrc" spellcheck="false">tick = week
stock  Water = 100
cloud  Faucet
cloud  Drain
flow   Filling:  Faucet -> Water = 3
flow   Draining: Water -> Drain = 10% of Water
link   Water ~> Draining
loop   B  Water, Draining</textarea>
<p class="gm-err" id="gmerr"></p>
<div class="gm-ctl"><button id="gmrun">Run</button><button id="gmstep">Step</button><button id="gmreset">Reset</button><span id="gmtick">week 0</span></div>
</div>
<div style="min-width:0"><svg id="gmsvg" width="100%" role="img" aria-label="Stock and flow map"></svg></div>
</div>
<div style="margin:1.25rem 0 0"><canvas id="gmchart" style="width:100%;display:block"></canvas></div>
<script>
(function(){
const $=id=>document.getElementById(id);
let M=null,hist=[],t=0,timer=null,unit='tick',HORIZON=52;
const fmt=v=>{const a=Math.abs(v);return a>=1000?Math.round(v).toLocaleString():a>=10?v.toFixed(0):v.toFixed(1)};
function parse(text){
 const m={stocks:{},clouds:{},flows:{},links:[],loops:[],order:[],unit:'tick'};
 text.split('\n').forEach((raw,i)=>{
  const l=raw.replace(/#.*/,'').trim(); if(!l) return;
  const bad=()=>{throw new Error('Line '+(i+1)+": can't read \""+l+'"')};
  let r,p;
  if(r=l.match(/^tick\s*=\s*(\w+)$/i)) m.unit=r[1];
  else if(r=l.match(/^stock\s+(\w+)\s*=\s*(-?[\d.]+)$/i)){m.stocks[r[1]]={name:r[1],v:+r[2]};m.order.push(r[1])}
  else if(r=l.match(/^cloud\s+(\w+)$/i)){m.clouds[r[1]]={name:r[1]}}
  else if(r=l.match(/^flow\s+(\w+)\s*:\s*(\w+)\s*->\s*(\w+)\s*=\s*(.+)$/i)){
   const e=r[4].trim(); let rate;
   if(p=e.match(/^(-?[\d.]+)\s*%\s*of\s+(\w+)$/i)) rate={pct:+p[1]/100,of:p[2]};
   else if(/^-?[\d.]+$/.test(e)) rate={k:+e}; else bad();
   if((rate.k!=null&&rate.k<0)||(rate.pct!=null&&rate.pct<0)) throw new Error('Flow '+r[1]+': use a positive number. The arrow already sets the direction.');
   m.flows[r[1]]={name:r[1],from:r[2],to:r[3],rate};
  }
  else if(r=l.match(/^link\s+(\w+)\s*(~\|\|>|~>)\s*(\w+)$/i)) m.links.push({from:r[1],to:r[3],delay:r[2]==='~||>'});
  else if(r=l.match(/^loop\s+([RB])\s+(.+)$/i)) m.loops.push({kind:r[1].toUpperCase(),parts:r[2].split(',').map(s=>s.trim())});
  else bad();
 });
 const isN=n=>m.stocks[n]||m.clouds[n];
 for(const f of Object.values(m.flows)){
  if(!isN(f.from)) throw new Error('Flow '+f.name+': "'+f.from+"\" isn't a stock or cloud");
  if(!isN(f.to)) throw new Error('Flow '+f.name+': "'+f.to+"\" isn't a stock or cloud");
  if(f.rate.of&&!m.stocks[f.rate.of]) throw new Error('Flow '+f.name+': "'+f.rate.of+"\" isn't a stock");
 }
 for(const k of m.links){
  if(!m.stocks[k.from]) throw new Error('Link: "'+k.from+"\" isn't a stock. Links start at a stock.");
  if(!m.flows[k.to]) throw new Error('Link: "'+k.to+"\" isn't a flow. Links end at a flow's valve.");
 }
 if(!m.order.length) throw new Error('Add at least one stock.');
 return m;
}
const rateOf=f=>f.rate.pct!=null?f.rate.pct*M.stocks[f.rate.of].v:f.rate.k;
const snap=()=>{const o={};for(const n of M.order)o[n]=M.stocks[n].v;return o};
function tick(){const r={};for(const f of Object.values(M.flows))r[f.name]=rateOf(f);
 for(const f of Object.values(M.flows)){if(M.stocks[f.from])M.stocks[f.from].v-=r[f.name];if(M.stocks[f.to])M.stocks[f.to].v+=r[f.name]}
 t++;hist.push(snap())}
function draw(){
 const fl=Object.values(M.flows), W=620, cx=310, sw=116, RH=46, GAP=20, xL=cx-sw/2, xR=cx+sw/2;
 const band={}; let y=24;
 for(const n of M.order){
  const ins=fl.filter(f=>f.to===n&&M.clouds[f.from]), outs=fl.filter(f=>f.from===n&&M.clouds[f.to]);
  const k=Math.max(ins.length,outs.length,1); band[n]={top:y,h:Math.max(k*RH,60),k,ins,outs}; y+=band[n].h+GAP;
 }
 const H=y, valve={};
 let s='<defs><marker id="gmp" viewBox="0 0 16 16" refX="9" refY="8" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M3,3 L13,8 L3,13 Z" fill="context-stroke" stroke="context-stroke" stroke-width="3" stroke-linejoin="round"/></marker><marker id="gml" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M2,2 L8,5 L2,8 Z" fill="var(--link)" stroke="var(--link)" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>';
 const cloud=(x,yy,n,anchor)=>{s+='<g transform="translate('+x+','+yy+')" fill="var(--surface-1)" stroke="var(--border-stronger)"><circle cx="-7" cy="1" r="6"/><circle cx="0" cy="-3" r="8"/><circle cx="8" cy="1" r="6"/><rect x="-7" y="1" width="15" height="6" stroke="none"/><path d="M-13,1 Q-13,7 -7,7 L8,7 Q14,7 14,1" fill="none"/></g>';
  s+='<text x="'+(anchor==='end'?x-20:x+22)+'" y="'+(yy+4)+'" text-anchor="'+anchor+'" style="font-size:12px;fill:var(--text-secondary)">'+n+'</text>'};
 const pipe=(x1,yy,x2,f,col,side)=>{const mx=(x1+x2)/2; valve[f.name]={x:mx,y:yy,side};
  s+='<line x1="'+x1+'" y1="'+yy+'" x2="'+x2+'" y2="'+yy+'" stroke="'+col+'" stroke-width="9" stroke-linecap="round" marker-end="url(#gmp)"/>';
  s+='<path d="M'+(mx-7)+','+(yy-9)+'L'+(mx+7)+','+(yy-9)+'L'+(mx-7)+','+(yy+9)+'L'+(mx+7)+','+(yy+9)+'Z" fill="var(--surface-0)" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"/>';
  s+='<text x="'+(side==='L'?mx-12:mx+12)+'" y="'+(yy+20)+'" text-anchor="'+(side==='L'?'end':'start')+'" style="font-size:11px;fill:var(--text-secondary)">'+f.name+' <tspan style="fill:var(--text-primary);font-weight:500">'+fmt(rateOf(f))+'</tspan></text>'};
 for(const n of M.order){const b=band[n];
  const pad=(b.h-b.k*RH)/2;
  b.ins.forEach((f,i)=>{const yy=b.top+pad+RH/2+i*RH-5; cloud(62,yy,f.from,'end'); pipe(84,yy,xL-12,f,'var(--in)','L')});
  b.outs.forEach((f,i)=>{const yy=b.top+pad+RH/2+i*RH-5; pipe(xR+8,yy,W-86,f,'var(--out)','R'); cloud(W-62,yy,f.to,'start')});
 }
 for(const f of fl){ if(M.stocks[f.from]&&M.stocks[f.to]){const a=band[f.from],b=band[f.to], down=a.top<b.top;
  const y1=down?a.top+a.h-12:a.top, y2=down?b.top-10:b.top+b.h-2, x=cx;
  s+='<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'" stroke="var(--link)" stroke-width="9" stroke-linecap="round" marker-end="url(#gmp)"/>';
  valve[f.name]={x:x,y:(y1+y2)/2,side:'L'}; s+='<text x="'+(x+12)+'" y="'+((y1+y2)/2+4)+'" style="font-size:11px;fill:var(--text-secondary)">'+f.name+' '+fmt(rateOf(f))+'</text>'}}
 const used={};
 for(const k of M.links){const v=valve[k.to], b=band[k.from]; if(!v||!b)continue;
  const left=v.x<cx, dir=left?-1:1, key=k.from+(left?'L':'R'), j=used[key]=(used[key]||0)+1, o=(j-1)*7;
  let d, mid;
  if(v.y>=b.top-4){ const sx=left?xL+20+o:xR-20-o, sy=b.top, ex=v.x, ey=v.y-12, ly=b.top-12-o;
   d='M'+sx+','+sy+' C'+sx+','+ly+' '+sx+','+ly+' '+(sx+dir*14)+','+ly+' L'+(ex-dir*14)+','+ly+' C'+ex+','+ly+' '+ex+','+ly+' '+ex+','+ey; mid=[(sx+ex)/2,ly];
  } else { const sx=left?xL:xR, sy=b.top+12+o, ex=v.x+(left?10:-10), ey=v.y+11, lx=ex;
   d='M'+sx+','+sy+' L'+(lx-dir*14)+','+sy+' C'+lx+','+sy+' '+lx+','+sy+' '+lx+','+(sy-14)+' L'+lx+','+ey; mid=[lx,(sy+ey)/2]; }
  s+='<path d="'+d+'" fill="none" stroke="var(--link)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gml)"/>';
  if(k.delay){const [dx,dy]=mid, vert=v.y<b.top-4;
   s+=vert?'<path d="M'+(dx-6)+','+(dy-3)+'h12M'+(dx-6)+','+(dy+3)+'h12" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round"/>':'<path d="M'+(dx-3)+','+(dy-6)+'v12M'+(dx+3)+','+(dy-6)+'v12" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round"/>'}}
 for(const L of M.loops){const fn=L.parts.find(p=>valve[p]); if(!fn)continue; const v=valve[fn];
  const bx=v.side==='L'?v.x-40:v.x+40, by=v.y-19;
  s+='<g><circle cx="'+bx+'" cy="'+by+'" r="11" fill="var(--surface-0)" stroke="var(--link)" stroke-width="1.8" stroke-dasharray="52 17" stroke-linecap="round"/><text x="'+bx+'" y="'+(by+4)+'" text-anchor="middle" style="font-size:11px;font-weight:600;fill:var(--text-primary)">'+L.kind+'</text></g>'}
 for(const n of M.order){const b=band[n], v=M.stocks[n].v, h=b.h-10;
  s+='<rect x="'+xL+'" y="'+b.top+'" width="'+sw+'" height="'+h+'" rx="14" fill="var(--stock)"/>';
  s+='<text x="'+cx+'" y="'+(b.top+h/2-5)+'" text-anchor="middle" style="font-size:12px;fill:var(--stock-sub)">'+n+'</text>';
  s+='<text x="'+cx+'" y="'+(b.top+h/2+16)+'" text-anchor="middle" style="font-size:19px;font-weight:600;fill:'+(v<0?'var(--text-danger)':'var(--stock-ink)')+'">'+fmt(v)+'</text>'}
 const svg=$('gmsvg'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.innerHTML=s;
 $('gmtick').textContent=unit+' '+t; chart();
}
function chart(){
 const c=$('gmchart'),dpr=devicePixelRatio||1,W=c.clientWidth, n=M.order.length, RH=n>1?60:180, H=n*RH+26;
 c.style.height=H+'px'; c.width=W*dpr;c.height=H*dpr;
 const g=c.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement), ink=cs.getPropertyValue('--stock-sub').trim(), mut=cs.getPropertyValue('--text-muted').trim(), br=cs.getPropertyValue('--border').trim(), dng=cs.getPropertyValue('--text-danger').trim();
 const L=60,R=110, px=i=>L+i*(W-L-R)/HORIZON; g.font='11px sans-serif';
 M.order.forEach((nm,k)=>{
  const T=k*RH+8, B=T+RH-16; let lo=0,hi=0; hist.forEach(h=>{lo=Math.min(lo,h[nm]);hi=Math.max(hi,h[nm])}); if(hi===lo)hi=lo+1;
  const step=Math.pow(10,Math.floor(Math.log10((hi-lo)/2))); const nice=[1,2,5,10].map(q=>q*step).find(q=>(hi-lo)/q<=(n>1?2:5))||step*10;
  lo=Math.floor(lo/nice)*nice; hi=Math.ceil(hi/nice)*nice; const py=v=>T+(hi-v)/(hi-lo)*(B-T);
  for(let v=lo;v<=hi+1e-9;v+=nice){g.strokeStyle=br;g.lineWidth=1;g.beginPath();g.moveTo(L,py(v));g.lineTo(W-R,py(v));g.stroke();if(n===1||Math.abs(v-lo)<1e-9||Math.abs(v-hi)<1e-9){g.fillStyle=mut;g.textAlign='right';g.fillText(fmt(v),L-6,py(v)+(Math.abs(v-hi)<1e-9&&n>1?9:0))}}
  if(lo<0){g.strokeStyle=dng;g.setLineDash([4,3]);g.beginPath();g.moveTo(L,py(0));g.lineTo(W-R,py(0));g.stroke();g.setLineDash([])}
  g.strokeStyle=ink;g.lineWidth=2.5;g.lineCap='round';g.lineJoin='round';g.beginPath();hist.forEach((h,i)=>i?g.lineTo(px(i),py(h[nm])):g.moveTo(px(i),py(h[nm])));g.stroke();
  const last=hist[hist.length-1][nm]; g.textAlign='left'; g.fillStyle=mut; g.fillText(nm,W-R+10,T+12); g.fillStyle=last<0?dng:ink; g.font='500 13px sans-serif'; g.fillText(fmt(last),W-R+10,T+30); g.font='11px sans-serif';
 });
 g.textAlign='center';g.fillStyle=mut;
 for(let w=0;w<=HORIZON;w+=13){g.fillText(w===0?'now':w+' '+unit+'s',px(w),H-6);g.strokeStyle=br;g.beginPath();g.moveTo(px(w),4);g.lineTo(px(w),H-20);g.stroke()}
}
function stop(){clearInterval(timer);timer=null;$('gmrun').textContent='Run'}
function load(){stop();try{M=parse($('gmsrc').value);$('gmerr').textContent=''}catch(e){$('gmerr').textContent=e.message;return}
 unit=M.unit;t=0;hist=[snap()];draw()}
$('gmrun').onclick=()=>{if(!M)return;if(timer){stop();return}if(t>=HORIZON)load();timer=setInterval(()=>{tick();draw();if(t>=HORIZON)stop()},90);$('gmrun').textContent='Pause'};
$('gmstep').onclick=()=>{if(M&&t<HORIZON){tick();draw()}};
$('gmreset').onclick=load;
let d;$('gmsrc').addEventListener('input',()=>{clearTimeout(d);d=setTimeout(load,300)});
addEventListener('resize',()=>M&&chart());
load();
})();
</script></body></html>
